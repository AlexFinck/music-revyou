<!DOCTYPE html>
<html>

<head>
    <title>New review</title>
</head>

<body>
    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <form action="/submit_review" method="post">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />        
        <h1>New review</h1>

        <p>
            Album title: <br />
            <input type="text" name="album_title" maxlength="200" required/>
        </p>
        <p>
            Artist: <br />
            <input type="text" name="artist" maxlength="200" required/>
        </p>
        <p>
            Release year: <br />
            <input type="text" name="release_year" required/>
        </p>
        <p>
            Rating (1-10): <br />
            <input type="text" name="rating" required />
        </p>
        {% for title in classes %}
            <details>
                <summary>Choose {{ title | lower }}</summary>
                {% for option in classes[title] %}
                    <div>
                        <label>
                            <input type="checkbox" name="classes" value="{{ title }}:{{ option }}" />
                            {{ option }}
                        </label>
                    </div>
                {% endfor %}
            </details>
        {% endfor %}
        <p>
            Review (optional): <br />
            <textarea name="review" rows="5" cols="40"></textarea>
        </p>
        <input type="submit" value="Submit review" />
    </form>
</body>

</html>
