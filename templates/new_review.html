<!DOCTYPE html>
<html>

<head>
    <title>New review</title>
</head>

<body>
    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <form action="/submit_review" method="post">
        <h1>New review</h1>

        <p>
            Album title: <br />
            <input type="text" name="album_title" maxlength="200" required/>
        </p>
        <p>
            Artist: <br />
            <input type="text" name="artist" maxlength="200" required/>
        </p>
        <p>
        Genre: <br />
        <select name="genre">
            <option value="">(choose)</option>
            <option value="Blues">Blues</option>
            <option value="Classical">Classical</option>
            <option value="Country">Country</option>
            <option value="Electronic">Electronic</option>
            <option value="Folk">Folk</option>
            <option value="Funk">Funk</option>
            <option value="Hip-Hop / Rap">Hip-Hop / Rap</option>
            <option value="Indie / Alternative">Indie / Alternative</option>
            <option value="Jazz">Jazz</option>
            <option value="Latin">Latin</option>
            <option value="Metal">Metal</option>
            <option value="Pop">Pop</option>
            <option value="Punk">Punk</option>
            <option value="R&B / Soul">R&amp;B / Soul</option>
            <option value="Reggae">Reggae</option>
            <option value="Rock">Rock</option>
            <option value="Soundtrack">Soundtrack</option>
            <option value="World">World</option>
            <option value="Other">Other</option>
        </select>
        </p>
        <p>
        Language: <br />
        <select name="language">
            <option value="">(choose)</option>
            <option value="English">English</option>
            <option value="Finnish">Finnish</option>
            <option value="Swedish">Swedish</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Italian">Italian</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Mandarin Chinese">Mandarin Chinese</option>
            <option value="Arabic">Arabic</option>
            <option value="Hindi">Hindi</option>
            <option value="Multiple languages">Multiple languages</option>
            <option value="Instrumental">Instrumental</option>
            <option value="Other">Other</option>
        </select>
        </p>
        <p>
            Release year: <br />
            <input type="text" name="release_year" required/>
        </p>
        <p>
            Rating (1-10): <br />
            <input type="text" name="rating" required />
        </p>
        <p>
            Review (optional): <br />
            <textarea name="review" rows="5" cols="40"></textarea>
        </p>
        <input type="submit" value="Submit review" />
    </form>
</body>

</html>
