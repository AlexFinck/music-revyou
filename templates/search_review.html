<!DOCTYPE html>
<html>

<head>
  <title>Search review</title>
</head>

<body>
    <h1>Search review</h1>

    <form action="/search_review" method="get">
     <p>
       Search: <input type="text" name="query" value="{{ query }}" >
     </p>
    <input type="submit" value="Send">
    </form>

    <p>
      <a href="/">Return</a>
    </p>

    {% if query %}
    <h2>Results</h2>

    <ul>
      {% for review in results %}
      <li><a href="/review/{{ review.id }}">{{ review.album_title }}</a></li>
      {% endfor %}
    </ul>
    {% endif %}
</body>

</html>
